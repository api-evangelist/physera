name: Physera
description: 'Physera was a virtual physical therapy (musculoskeletal) startup that
  provided members video access to a nationwide network of licensed physical therapists
  for diagnosis and treatment, along with in-application 3D exercise animations, voice
  prompts, computer-vision range-of-motion measurement, and asynchronous messaging.
  Backed by Lux Capital, Physera was acquired by Omada Health in May 2020 (reported
  ~$30M) and now operates as the "Omada MSK by Physera" digital care program; the
  physera.com domain redirects to omadahealth.com/musculoskeletal. This profile was
  added to the API Evangelist network as a portfolio-lead stub; enrichment found no
  public API, developer portal, OpenAPI/AsyncAPI surface, or documented event/webhook
  surface — it is a member-facing clinical product with no first-party developer program.'
